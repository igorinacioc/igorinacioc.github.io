# Hugo configuration
title: Igor Inácio
baseURL: https://igorinacioc.github.io/

author:
  name: Igor Inácio
  email: igorinaciocorreia@gmail.com

# Disable RSS until blog has posts
disableKinds:
  - RSS

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Projetos
      pageRef: /projects
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: Sobre
      pageRef: /about
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/igorinacioc"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: false

  theme:
    default: system
    displayToggle: true

  editURL:
    enable: true
    base: "https://github.com/igorinacioc/igorinacioc.github.io/edit/main/content"
